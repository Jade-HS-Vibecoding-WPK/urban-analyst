<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URBAN ANALYST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
[hidden]{display:none!important}
:root{--bg:#0f0e13;--panel:#17161d;--panel2:#1f1d26;--line:#2a2833;--text:#ecebf1;--muted:#8d8999;--acc:#8b5cf6;--acc2:#a78bfa;--accbg:rgba(139,92,246,.14);--ok:#3ecf8e;--warn:#f5b544;--err:#f0616d;--shadow:0 8px 30px rgba(0,0,0,.45);--r:10px}
[data-theme=light]{--bg:#f3f2f6;--panel:#ffffff;--panel2:#f6f5f9;--line:#e5e3ea;--text:#1d1b22;--muted:#76727f;--accbg:rgba(139,92,246,.1);--shadow:0 8px 30px rgba(40,30,70,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,Segoe UI,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{--lw:330px;--rw:320px;display:grid;grid-template-columns:var(--lw) 1fr var(--rw);height:100vh;transition:grid-template-columns .2s ease}
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
#right{border-right:0;border-left:1px solid var(--line)}
.spacer{flex:1}
.muted{color:var(--muted)}.tiny{font-size:11px}.pad{padding:14px}.pad-t{padding-top:10px}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#8b5cf6,#d946ef);display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px;letter-spacing:.5px}
.brand-t{font-weight:700;letter-spacing:1.6px;font-size:12.5px}.brand-s{color:var(--muted);font-size:11px}
.proj{display:flex;gap:4px;padding:0 10px 10px;border-bottom:1px solid var(--line)}
.inp{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;outline:none;width:100%}
.inp:focus{border-color:var(--acc)}
.inp.ghost{background:transparent;border-color:transparent;font-weight:600}.inp.ghost:hover{border-color:var(--line)}
.inp.sm{padding:6px 8px;width:auto}
.icon-btn{background:transparent;border:1px solid transparent;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted);flex:none;display:grid;place-items:center;font-size:14px}
.icon-btn:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.primary:hover{background:#7c4ae6}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%;margin-top:10px}.btn.sm{padding:5px 10px;font-size:12px}
.link{background:none;border:0;color:var(--acc2);cursor:pointer;font-size:11.5px;padding:0 0 0 8px}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
#left .proj,#left .sec{border-bottom:2px solid var(--acc)} /* Trennstreifen links: Akzent-Lila */
.sec-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px}
.num{width:18px;height:18px;border-radius:50%;background:var(--accbg);color:var(--acc2);display:grid;place-items:center;font-size:10.5px}
.area-info{font-size:12.5px}.area-info b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:12px;user-select:none;display:flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--text)}
.log-h{padding:12px 14px 0;margin:0}
.hbtn{font-size:15px;width:28px;height:26px;text-transform:none}.hbtn:disabled{opacity:.3;cursor:default}
.hrow{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid transparent}
.hrow:hover{background:var(--panel2)}.hrow .hd{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}.hrow .ht{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .hz{color:var(--muted);font-size:11px;flex:none}.hrow.cur{border-color:var(--acc);background:var(--accbg)}.hrow.cur .hd{background:var(--acc)}
.hrow.undone{opacity:.45}.hrow.undone .ht{text-decoration:line-through}.hrow.gone{cursor:default;opacity:.35}
.log{flex:1;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.msg{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:12.5px}
.msg.user{align-self:flex-end;background:var(--accbg);border-color:transparent;max-width:90%}
.msg .mh{display:flex;align-items:center;gap:7px;font-weight:600;margin-bottom:4px}
.msg .st{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--muted)}
.msg .st.run{border-color:var(--acc);border-top-color:transparent;animation:sp .8s linear infinite}
.msg .st.ok{background:var(--ok);border-color:var(--ok)}.msg .st.err{background:var(--err);border-color:var(--err)}.msg .st.warn{background:var(--warn);border-color:var(--warn)}
.msg ul{margin:4px 0 0;padding-left:16px}.msg li{margin:1px 0}
.msg .sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
#mapwrap{position:relative;min-width:0}
#map{position:absolute;inset:0}
.float{position:absolute;z-index:5;display:flex;gap:8px}
.tl{top:12px;left:12px;flex-direction:column;width:min(380px,calc(100% - 24px))}
.tr{top:12px;right:12px}
.bc{bottom:18px;left:50%;transform:translateX(-50%)}
.search{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:0 10px}
.search input{flex:1;background:transparent;border:0;outline:none;padding:9px 6px}
.s-ic{color:var(--muted);font-size:16px}
.results{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;max-height:340px;overflow-y:auto}
.res{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.res:hover{background:var(--panel2)}.res:last-child{border-bottom:0}
.res .rt{font-weight:500}.res .rs{color:var(--muted);font-size:11.5px}
.res .ra{display:flex;gap:6px;margin-top:5px}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;gap:2px;align-items:center}
.toolbar button{background:none;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:16px;color:var(--text);min-width:58px}
.toolbar button span{font-size:10.5px;color:var(--muted);margin-top:1px}
.toolbar button:hover{background:var(--panel2)}
.toolbar button.on{background:var(--accbg)}.toolbar button.on span{color:var(--acc2)}
.toolbar .sep{width:1px;height:30px;background:var(--line);margin:0 4px}
.hint.fade{opacity:0;transition:opacity .4s ease}
.hint{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--acc);border-radius:999px;padding:7px 14px;font-size:12px;box-shadow:var(--shadow);z-index:6;white-space:nowrap}
.busy{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);z-index:6}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc);border-top-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;padding:10px 10px 0;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:8px 4px 9px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
.tabbody{flex:1;overflow:auto;min-height:0}
.grp{padding:10px 12px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}
.layer{margin:4px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2)}
.lrow{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 6px}
.lrow .nm{flex:1;min-width:0;cursor:pointer}
.lrow .nm b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .nm small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .nm small{color:var(--muted);font-size:11px}
.sw{width:16px;height:16px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.15)}
.eye{background:none;border:0;cursor:pointer;color:var(--text);width:24px;font-size:14px;opacity:.9}
.eye.off{opacity:.3}
.ldet{border-top:1px solid var(--line);padding:8px 10px 10px}
.ldet .row{display:flex;align-items:center;gap:8px;margin:5px 0}
.ldet .row label{width:92px;flex-shrink:0;white-space:nowrap;color:var(--muted);font-size:12px}
.ldet input[type=range]{flex:1;accent-color:var(--acc)}
.cls{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.cls input[type=color]{width:22px;height:18px;border:0;padding:0;background:none;cursor:pointer}
.cls span{flex:1}.cls em{color:var(--muted);font-style:normal;font-size:11px}
.lbtns{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.lbtns button{font-size:11.5px;padding:4px 8px}
.empty{padding:24px 16px;color:var(--muted);text-align:center}
.leg-l{padding:10px 14px 4px;font-weight:600;font-size:12px}
.leg-i{display:flex;align-items:center;gap:9px;padding:3px 14px;font-size:12px}
.leg-i i{width:18px;height:11px;border-radius:2px;flex:none}
.leg-i i.ln{height:3px;border-radius:2px}.leg-i i.pt{width:9px;height:9px;border-radius:50%;margin:0 4px}
.leg-i i.ol{background:none!important;border:1.5px dashed}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px}
.kpi b{display:block;font-size:17px;font-weight:600}.kpi span{color:var(--muted);font-size:11px}
.st-l{padding:8px 14px 2px;font-weight:600;font-size:12px;display:flex}
.st-row{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;padding:3px 14px;font-size:12px}
.st-row i{width:10px;height:10px;border-radius:2px}
.st-row em{font-style:normal;color:var(--muted);text-align:right;min-width:44px}
.bar{height:4px;background:var(--line);border-radius:2px;margin:2px 14px 6px 34px;overflow:hidden}.bar div{height:100%}
.nerd{margin:6px 12px;border-radius:8px;background:rgba(245,181,68,.1);border:1px solid rgba(245,181,68,.35);font-size:11.5px}
.ldet .nerd{margin:8px 0}
.nerd>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;color:var(--warn);font-weight:600;user-select:none}
.nerd>summary::-webkit-details-marker{display:none}
.nerd>summary .arr{transition:transform .2s;font-size:10px}
.nerd[open]>summary .arr{transform:rotate(180deg)}
.nerd .nerd-b{padding:0 10px 8px}
.nerd .nerd-b .note{margin:6px 0;background:none;border:0;padding:0}
.tchips{display:flex;flex-wrap:wrap;gap:4px;flex:1;align-items:center}
.tchip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;border:1px solid var(--acc);background:var(--accbg);color:var(--text);font-size:11.5px;cursor:pointer;font-family:inherit}
.tchip .x{color:var(--muted);font-size:13px;line-height:1}.tchip:hover .x{color:var(--err)}
.tchip.add{border-style:dashed;background:none;color:var(--acc2)}
.tadd{width:84px!important;flex:none!important;padding:2px 6px!important;font-size:11.5px!important}
.days{display:flex;gap:5px;white-space:nowrap;align-items:center;flex:1}
.days button{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--acc2);cursor:pointer;font-size:11.5px;font-family:inherit}
.days button.on{border-color:var(--acc);background:var(--accbg);color:var(--text)}
.ldet .row .val{min-width:44px;text-align:right}
.note{margin:6px 12px;padding:8px 10px;border-radius:8px;background:rgba(245,181,68,.1);border:1px solid rgba(245,181,68,.35);font-size:11.5px}
.ptab{width:100%;border-collapse:collapse;font-size:12px}
.ptab td{padding:4px 14px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
.ptab td:first-child{color:var(--muted);width:42%}
.ph{padding:14px 14px 8px}.ph b{font-size:14px;display:block}.ph .tag{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px}
.badge{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--accbg);color:var(--acc2);margin-left:4px}
.badge.est{background:rgba(245,181,68,.15);color:var(--warn)}.badge.na{background:rgba(240,97,109,.13);color:var(--err)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,94vw);padding:16px 18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;font-weight:600;font-size:15px;margin-bottom:12px}
.card-f{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.grid2{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;align-items:start}
.grid2>label{color:var(--muted);padding-top:7px}
.formats{display:flex;flex-direction:column;gap:4px}
.formats label{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.formats small{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:5px;padding-top:6px}
.maplibregl-ctrl-group{background:var(--panel)!important;border:1px solid var(--line);box-shadow:var(--shadow)!important}
.maplibregl-ctrl-group button{filter:var(--ctrl-filter,none)}
[data-theme=dark] .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
.maplibregl-ctrl-attrib{background:var(--panel)!important;color:var(--muted)}.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-scale{background:var(--panel)!important;color:var(--text)!important;border-color:var(--muted)!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
@media (max-width:1100px){#app{--lw:290px;--rw:270px}}
#app.noL{--lw:0px}#app.noR{--rw:0px}
#app.noL #left,#app.noR #right{border:0;overflow:hidden;min-width:0}
.pane-tog{position:absolute;top:64px;z-index:6;width:22px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:12px;padding:0}
.pane-tog:hover{color:var(--text);border-color:var(--acc)}
.pane-tog.l{left:0;border-left:0;border-radius:0 8px 8px 0}.pane-tog.r{right:0;border-right:0;border-radius:8px 0 0 8px}

.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;margin-bottom:8px}
.seg button{flex:1;background:none;border:0;border-radius:6px;padding:6px 4px;cursor:pointer;color:var(--muted);font-size:12px}
.seg button.on{background:var(--accbg);color:var(--text)}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
.views{margin-top:8px}.views summary{cursor:pointer;font-size:12px;color:var(--muted)}.views summary:before,#qBox summary:after{content:'▸';margin-right:6px}
.views[open] summary:before{content:'▾'}#qBox summary:after{margin-left:auto;margin-right:0}#qBox[open] summary:after{content:'▾'}
.vadd{display:flex;gap:6px;margin:8px 0 4px}.vadd .inp{flex:1;width:auto}
.vitem{display:flex;align-items:center;gap:4px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12px}
.vitem span{flex:1;cursor:pointer}.vitem span:hover{color:var(--acc2)}
.vitem button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer;padding:2px 6px;font-size:11px}
.vitem button:hover{color:var(--text);border-color:var(--muted)}
#left{position:relative}
.cls{flex-wrap:wrap}.cls .eye{width:18px;font-size:12px}.cls input.lbl{flex:1;min-width:60px;background:transparent;border:1px solid transparent;border-radius:5px;padding:2px 4px;color:var(--text);font-size:12px}
.cls input.lbl:hover,.cls input.lbl:focus{border-color:var(--line);outline:none}
.cls.off input.lbl,.cls.off em{opacity:.4}
.cls .more{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 2px}
.cmenu{flex-basis:100%;display:flex;gap:6px;align-items:center;padding:4px 0 6px 26px}
.cmenu select{flex:1;font-size:11px;padding:3px}
.ldet select.inp{width:100%}
.clsbar{display:flex;gap:10px;margin:6px 0 2px;font-size:11px}
#left{overflow:hidden}
.lscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.lscroll .log{flex:1 0 auto;overflow:visible;min-height:120px}
.btn{white-space:nowrap}

.icon-btn.plus{font-size:18px;color:var(--acc2);border-color:var(--line)}
.icon-btn.plus.on{background:var(--accbg);border-color:var(--acc)}
.busy .btn{margin-left:4px}
.handle{cursor:grab;color:var(--muted);user-select:none;font-size:13px;letter-spacing:-2px;padding:0 2px;opacity:.6}
.handle:hover{opacity:1;color:var(--text)}
.layer.drag,.cls.drag{opacity:.35}
.layer.over-top{box-shadow:0 -3px 0 var(--acc)}.layer.over-bot{box-shadow:0 3px 0 var(--acc)}
.cls.over-top{box-shadow:inset 0 2px 0 var(--acc)}.cls.over-bot{box-shadow:inset 0 -2px 0 var(--acc)}
.trash{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px;display:grid;place-items:center;border-radius:5px}
.trash:hover{color:var(--err);background:rgba(240,97,109,.12)}
.trash svg{width:14px;height:14px}
.msg .btn{margin-top:6px}
.cls .handle{flex:none}
.cls{gap:6px}

.jobs{list-style:none;padding-left:0!important}.jobs li{margin:3px 0}.spin.sm{display:inline-block;width:10px;height:10px;border-width:2px;vertical-align:-1px}

.sec-h.toggle{cursor:pointer;user-select:none;margin-bottom:8px}
.sec-h.toggle:hover{color:var(--text)}
.sec-h .chev{transition:transform .15s;font-size:11px}
.sec.closed .sec-h .chev{transform:rotate(-90deg)}
.sec.closed .sec-h{margin-bottom:0}
.sec.closed .sec-body{display:none}
.sec-h .sum{text-transform:none;letter-spacing:0;font-weight:500;font-size:11.5px;color:var(--acc2);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.gtabs button{background:none;border:1px solid transparent;border-radius:7px;padding:4px 8px;font-size:11.5px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px}
.gtabs button:hover{color:var(--text);background:var(--panel2)}
.gtabs button.on{background:var(--accbg);color:var(--text);border-color:var(--acc)}
.gtabs .cnt{background:var(--acc);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;min-width:16px;text-align:center}
.modfoot{display:flex;align-items:center;margin-top:8px}
.chip small{color:var(--muted);font-size:10.5px}
.sec-h .chev{display:inline-block;width:14px;text-align:center;transform:none!important;font-size:12px}
.sec-h .chev::after{content:'⌄';position:relative;top:-3px}
.sec.closed .sec-h .chev::after{content:'›';top:0;font-size:15px}

<script>
/* =====================================================================
   URBAN ANALYST – Kernlogik (ohne Karte, ohne Bildschirm)
   Hier passiert die eigentliche Analyse: OSM-Daten umwandeln,
   klassifizieren, Flächen messen, Pläne (SVG/DXF) erzeugen.
   ===================================================================== */
const UA = (function () {
  'use strict';
  const R = 6378137;
  const rad = d => d * Math.PI / 180;

  /* ---------- Geometrie-Helfer ---------- */
  const eq = (a, b) => a && b && a[0] === b[0] && a[1] === b[1];

  function ringArea(c) { // Fläche eines Rings auf der Kugel (m²)
    let a = 0; const n = c.length;
    if (n > 2) {
      for (let i = 0; i < n; i++) {
        let lo, mi, up;
        if (i === n - 2) { lo = n - 2; mi = n - 1; up = 0; }
        else if (i === n - 1) { lo = n - 1; mi = 0; up = 1; }
        else { lo = i; mi = i + 1; up = i + 2; }
        a += (rad(c[up][0]) - rad(c[lo][0])) * Math.sin(rad(c[mi][1]));
      }
      a = a * R * R / 2;
    }
    return Math.abs(a);
  }
  function polyArea(g) {
    if (!g) return 0;
    const one = rings => rings.length ? Math.max(0, ringArea(rings[0]) - rings.slice(1).reduce((s, r) => s + ringArea(r), 0)) : 0;
    if (g.type === 'Polygon') return one(g.coordinates);
    if (g.type === 'MultiPolygon') return g.coordinates.reduce((s, p) => s + one(p), 0);
    return 0;
  }
  function dist(a, b) { // Haversine in m
    const dLat = rad(b[1] - a[1]), dLon = rad(b[0] - a[0]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function eachCoord(g, fn) {
    if (!g) return;
    const t = g.type, c = g.coordinates;
    if (t === 'Point') fn(c);
    else if (t === 'LineString' || t === 'MultiPoint') c.forEach(fn);
    else if (t === 'Polygon' || t === 'MultiLineString') c.forEach(r => r.forEach(fn));
    else if (t === 'MultiPolygon') c.forEach(p => p.forEach(r => r.forEach(fn)));
  }
  function bboxOf(g) {
    const b = [Infinity, Infinity, -Infinity, -Infinity];
    eachCoord(g, p => { if (p[0] < b[0]) b[0] = p[0]; if (p[1] < b[1]) b[1] = p[1]; if (p[0] > b[2]) b[2] = p[0]; if (p[1] > b[3]) b[3] = p[1]; });
    return b;
  }
  const bboxHit = (a, b) => !(a[2] < b[0] || a[0] > b[2] || a[3] < b[1] || a[1] > b[3]);
  function pointInRing(p, ring) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if (((yi > p[1]) !== (yj > p[1])) && (p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function pointInPoly(p, g) {
    const inP = rings => pointInRing(p, rings[0]) && !rings.slice(1).some(h => pointInRing(p, h));
    if (g.type === 'Polygon') return inP(g.coordinates);
    if (g.type === 'MultiPolygon') return g.coordinates.some(inP);
    return false;
  }
  function centroid(g) { // Schwerpunkt (für Linien/Punkte: Mittel)
    if (g.type === 'Point') return g.coordinates;
    if (g.type === 'Polygon' || g.type === 'MultiPolygon') {
      const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
      let best = null, bestA = -1;
      for (const p of polys) { const a = ringArea(p[0]); if (a > bestA) { bestA = a; best = p[0]; } }
      let x = 0, y = 0, A = 0;
      for (let i = 0, j = best.length - 1; i < best.length; j = i++) {
        const f = best[j][0] * best[i][1] - best[i][0] * best[j][1];
        x += (best[j][0] + best[i][0]) * f; y += (best[j][1] + best[i][1]) * f; A += f;
      }
      if (Math.abs(A) < 1e-14) return best[0];
      return [x / (3 * A), y / (3 * A)];
    }
    let sx = 0, sy = 0, n = 0; eachCoord(g, p => { sx += p[0]; sy += p[1]; n++; });
    return [sx / n, sy / n];
  }
  function circlePoly(c, r, steps = 40) { // Kreis als Polygon (Einzugsradius)
    const pts = [];
    const lat = rad(c[1]), lon = rad(c[0]), d = r / R;
    for (let i = 0; i <= steps; i++) {
      const brg = 2 * Math.PI * (i % steps) / steps;
      const la = Math.asin(Math.sin(lat) * Math.cos(d) + Math.cos(lat) * Math.sin(d) * Math.cos(brg));
      const lo = lon + Math.atan2(Math.sin(brg) * Math.sin(d) * Math.cos(lat), Math.cos(d) - Math.sin(lat) * Math.sin(la));
      pts.push([lo * 180 / Math.PI, la * 180 / Math.PI]);
    }
    return { type: 'Polygon', coordinates: [pts] };
  }
  function simplifyLine(pts, tol) { // Douglas-Peucker
    if (pts.length < 3) return pts.slice();
    const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
    const stack = [[0, pts.length - 1]];
    while (stack.length) {
      const [s, e] = stack.pop(); let maxD = 0, idx = -1;
      const [x1, y1] = pts[s], [x2, y2] = pts[e]; const dx = x2 - x1, dy = y2 - y1; const L = dx * dx + dy * dy;
      for (let i = s + 1; i < e; i++) {
        let t = L ? ((pts[i][0] - x1) * dx + (pts[i][1] - y1) * dy) / L : 0; t = Math.max(0, Math.min(1, t));
        const ddx = pts[i][0] - (x1 + t * dx), ddy = pts[i][1] - (y1 + t * dy); const d2 = ddx * ddx + ddy * ddy;
        if (d2 > maxD) { maxD = d2; idx = i; }
      }
      if (idx > 0 && maxD > tol * tol) { keep[idx] = 1; stack.push([s, idx], [idx, e]); }
    }
    return pts.filter((_, i) => keep[i]);
  }
  function simplifyRingTo(ring, maxPts) {
    let tol = 0.00002, r = ring;
    while (r.length > maxPts && tol < 1) { r = simplifyLine(ring, tol); tol *= 2; }
    if (!eq(r[0], r[r.length - 1])) r.push(r[0]);
    return r;
  }

  /* ---------- UTM (ETRS89 ≈ WGS84) für Pläne in Metern ---------- */
  const utmZone = lon => Math.floor((lon + 180) / 6) + 1;
  function toUTM(lon, lat, zone) {
    const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996;
    const e2 = f * (2 - f), ep2 = e2 / (1 - e2);
    const lon0 = rad((zone - 1) * 6 - 180 + 3), phi = rad(lat);
    const s = Math.sin(phi), c = Math.cos(phi), t = Math.tan(phi);
    const N = a / Math.sqrt(1 - e2 * s * s), T = t * t, C = ep2 * c * c, A = c * (rad(lon) - lon0);
    const M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 ** 3 / 256) * phi
      - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * phi)
      + (15 * e2 * e2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * phi)
      - (35 * e2 ** 3 / 3072) * Math.sin(6 * phi));
    const x = k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120) + 500000;
    const y = k0 * (M + N * t * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
    return [x, y];
  }

  /* ---------- OSM (Overpass JSON) -> GeoJSON ---------- */
  const NOT_AREA_NATURAL = ['coastline', 'tree_row', 'cliff', 'ridge', 'arete', 'valley', 'gorge', 'tree'];
  function isArea(t) {
    if (t.area === 'no') return false;
    if (t.area === 'yes') return true;
    if (t.highway || t.barrier) return false;
    if (t.building || t['building:part'] || t.landuse || t.amenity || t.water || t.shop || t.military || t.boundary || t.place || t.tourism) return true;
    if (t.leisure && t.leisure !== 'track' && t.leisure !== 'slipway') return true;
    if (t.natural && !NOT_AREA_NATURAL.includes(t.natural)) return true;
    if (t.waterway && ['riverbank', 'dock', 'boatyard', 'dam'].includes(t.waterway)) return true;
    if (t.man_made && !['pier', 'embankment', 'pipeline', 'breakwater', 'groyne'].includes(t.man_made)) return true;
    return false;
  }
  function joinWays(ways) { // Liniensegmente zu geschlossenen Ringen verbinden
    const pool = ways.filter(w => w.length > 1).map(w => w.slice());
    const rings = [];
    while (pool.length) {
      let ring = pool.shift(); let guard = 0;
      while (!eq(ring[0], ring[ring.length - 1]) && guard++ < 100000) {
        const end = ring[ring.length - 1], start = ring[0]; let found = false;
        for (let i = 0; i < pool.length; i++) {
          const w = pool[i];
          if (eq(w[0], end)) ring = ring.concat(w.slice(1));
          else if (eq(w[w.length - 1], end)) ring = ring.concat(w.slice().reverse().slice(1));
          else if (eq(w[w.length - 1], start)) ring = w.slice(0, -1).concat(ring);
          else if (eq(w[0], start)) ring = w.slice().reverse().slice(0, -1).concat(ring);
          else continue;
          pool.splice(i, 1); found = true; break;
        }
        if (!found) break;
      }
      if (ring.length >= 4 && eq(ring[0], ring[ring.length - 1])) rings.push(ring);
    }
    return rings;
  }
  const feat = (geometry, tags, id) => ({ type: 'Feature', geometry, properties: Object.assign({ osm_id: id }, tags) });
  // OSM-Angaben ohne Nutzen für die Stadtanalyse (Kontakt, Webseiten, Öffnungszeiten, Bezahlarten, Wikidata, Fotos, Prüfdaten, fremdsprachige Namen …)
  const DROP_TAGS = /^(contact:.*|phone|fax|email|website|url|opening_hours(:.*)?|service_times|collection_times|payment:.*|currency:.*|wikidata|wikipedia|wikimedia_commons|image|mapillary|panoramax|[\w]+:wikidata|[\w]+:wikipedia|heritage:website|check_date(:.*)?|survey(:.*)?|source(:.*)?|note(:.*)?|fixme|FIXME|toilets:.+|name:(?!de$).*|old_name:.*|alt_name:.*|ref:(?!bag$).*|brand:.*|operator:.*|network:.*|level:ref|internet_access(:.*)?|diet:.*|delivery|takeaway|drive_through|outdoor_seating|reservation|smoking|air_conditioning|dog|changing_table(:.*)?)$/;
  const keepTags = t => { const o = {}; for (const k in t) if (!DROP_TAGS.test(k)) o[k] = t[k]; return o; };
  function osmToFeatures(json) {
    const out = [];
    for (const el of (json && json.elements) || []) {
      const t = keepTags(el.tags || {}); const id = el.type + '/' + el.id;
      if (el.type === 'node') {
        if (el.lat == null) continue;
        out.push(feat({ type: 'Point', coordinates: [el.lon, el.lat] }, t, id));
      } else if (el.type === 'way') {
        const c = (el.geometry || []).filter(Boolean).map(p => [p.lon, p.lat]);
        if (c.length < 2) continue;
        const closed = c.length >= 4 && eq(c[0], c[c.length - 1]);
        if (closed && isArea(t)) out.push(feat({ type: 'Polygon', coordinates: [c] }, t, id));
        else out.push(feat({ type: 'LineString', coordinates: c }, t, id));
      } else if (el.type === 'relation') {
        if (!['multipolygon', 'boundary', 'building'].includes(t.type)) continue;
        const outers = [], inners = [];
        for (const m of el.members || []) {
          if (m.type !== 'way' || !m.geometry) continue;
          if (m.role === 'part' || m.role === 'subarea' || m.role === 'admin_centre' || m.role === 'label') continue;
          const c = m.geometry.filter(Boolean).map(p => [p.lon, p.lat]);
          (m.role === 'inner' ? inners : outers).push(c);
        }
        const oR = joinWays(outers), iR = joinWays(inners);
        if (!oR.length) continue;
        const polys = oR.map(r => [r]);
        for (const ir of iR) { const p = polys.find(pl => pointInRing(ir[0], pl[0])); if (p) p.push(ir); }
        const geom = polys.length === 1 ? { type: 'Polygon', coordinates: polys[0] } : { type: 'MultiPolygon', coordinates: polys };
        out.push(feat(geom, t, id));
      }
    }
    return out;
  }
  const isPoly = g => g && (g.type === 'Polygon' || g.type === 'MultiPolygon');
  const isLine = g => g && (g.type === 'LineString' || g.type === 'MultiLineString');
  const isPoint = g => g && g.type === 'Point';

  /* ---------- Overpass-Abfragen (Datenbeschaffung) ---------- */
  const HEAD = '[out:json][timeout:150][maxsize:536870912];';
  const FETCHES = {

    push(0, 'SECTION', 2, 'HEADER', 9, '$ACADVER', 1, 'AC1009', 0, 'ENDSEC');
    push(0, 'SECTION', 2, 'TABLES');
    push(0, 'TABLE', 2, 'LTYPE', 70, 1, 0, 'LTYPE', 2, 'CONTINUOUS', 70, 0, 3, 'Solid line', 72, 65, 73, 0, 40, '0.0', 0, 'ENDTAB');
    push(0, 'TABLE', 2, 'LAYER', 70, layerDefs.length);
    for (const [n, c] of layerDefs) push(0, 'LAYER', 2, n, 70, 0, 62, c, 6, 'CONTINUOUS');
    push(0, 'ENDTAB', 0, 'ENDSEC');
    push(0, 'SECTION', 2, 'ENTITIES');
    const poly = (coords, layer, closed, width) => {
      let pts = coords; if (closed && pts.length > 1 && eq(pts[0], pts[pts.length - 1])) pts = pts.slice(0, -1);

<script>

(function () {

    sat: () => raster(['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], 'Luftbild: Esri, Maxar, Earthstar Geographics', {}, 19),
    none: () => ({ version: 8, sources: {}, layers: [{ id: 'bg-color', type: 'background', paint: { 'background-color': S.theme === 'dark' ? '#141318' : '#ffffff' } }] })
  };

    container: 'map', style: STYLES.dark(), center: [13.405, 52.515], zoom: 12,

    const closed = app.classList.contains(cls), b = $(side === 'l' ? '#togL' : '#togR');
    b.textContent = side === 'l' ? (closed ? '›' : '‹') : (closed ? '‹' : '›'); b.title = (side === 'l' ? 'Linke' : 'Rechte') + ' Leiste ' + (closed ? 'ausklappen' : 'einklappen');

    if (e && e.error && !e.tile && !e.sourceId && /style/i.test(String(e.error.message)) && S.basemap !== 'none' && !S.styleReady) { // nur wenn der Kartenstil selbst nicht lädt

  map.once('style.load', () => { S.styleReady = true; restoreAll(); });

  /* ---------- Gebiet ---------- */
  function viewPolygon() {

  function setSelection(geom, label, noFit, quiet) {

  async function berlinWfs(fetchId, prog) { // Daten vom Geoportal Berlin (seitenweise)

          .catch(e => { if (S.abort && S.abort.signal.aborted) { const c = new Error('Abgebrochen'); c.cancelled = true; throw c; } throw new Error('Geoportal Berlin nicht erreichbar'); });

  /* ---------- Flurstücke: Berlin (Geoportal, JSON) oder Niedersachsen (LGLN, GML), seitenweise ---------- */
  async function katasterFetch(prog) {
    const g = S.selection.geometry, b = UA.bboxOf(g), sig = S.abort ? S.abort.signal : undefined;
    const fail = () => { if (S.abort && S.abort.signal.aborted) { const c = new Error('Abgebrochen'); c.cancelled = true; throw c; } throw new Error('Katasterdienst nicht erreichbar'); };

      const out = [], COUNT = 5000;

        const r = await fetch(UA.berlinWfsUrl('alkis_flurstuecke', 'alkis_flurstuecke:flurstuecke', b, start, COUNT), { signal: sig }).catch(fail);
        if (!r.ok) throw new Error('Geoportal Berlin: Fehler ' + r.status);

  }

  /* ---------- Amtliche Gebäudehöhen Niedersachsen (LGLN, Kacheln über STAC) ---------- */

    const raw = L.features.filter(f => f.geometry.type === 'Point').map(f => {
      const t = f.properties; const big = /^(station|halt)$/.test(t.railway || '') || t.station === 'subway' || t.public_transport === 'station';
      return { type: 'Feature', geometry: UA.circlePoly(f.geometry.coordinates, big ? 600 : 300), properties: { name: f.properties.name, radius: big ? '600 m (Bahn)' : '300 m (Bus/Tram)', osm_id: f.properties.osm_id } };
    });
    const R = UA.makeBaseLayer('abfrage', S.cache.data, { id: L.id + '_radien', raw, name: 'Einzugsradien ÖPNV' });
    UA.applySplit(R, 'attr:radius'); R.opacity = 0.15; R.statMode = 'none'; R.base = 'flaechen'; R.group = 'Verkehr';
    upsertLayer(R); syncLayers(); renderAll();
  }

  function renderLegend() {
    const box = $('#legend'); const vis = S.layers.filter(L => L.visible).slice().reverse();
    if (!vis.length) { box.innerHTML = '<div class="empty">Keine sichtbaren Layer.</div>'; return; }
    box.innerHTML = vis.map(L => {
      const used = L.classes.filter(c => c.visible !== false && L.features.some(f => f.properties._cls === c.key)); if (!used.length) return '';
      return `<div class="leg-l">${esc(L.name)}</div>` + used.map(c => {
        const g = (L.features.find(f => f.properties._cls === c.key && !f.properties._lblonly) || L.features.find(f => f.properties._cls === c.key)).geometry.type;
        const k = L.outlineOnly ? 'ol' : /Line/.test(g) ? 'ln' : g === 'Point' ? 'pt' : '';
        return `<div class="leg-i"><i class="${k}" style="background:${c.color};border-color:${c.color}"></i>${esc(c.label)}</div>`;
      }).join('');
    }).join('') + '<div class="pad tiny muted">Daten: © OpenStreetMap-Mitwirkende (ODbL)</div>';
  }

  /* ---------- Statistik ---------- */
  const intersect = window.turf ? (f, sel) => turf.intersect(turf.featureCollection([f, sel])) : null;
  function computeStats() { S.stats = {}; if (!S.selection) return; for (const L of S.layers) S.stats[L.id] = UA.layerStats(L, S.selection, intersect); }
  function renderStats() {
    const box = $('#stats');
    if (!S.selection) { box.innerHTML = '<div class="empty">Wähle zuerst ein Gebiet und lade Daten.</div>'; return; }
    const selA = UA.polyArea(S.selection.geometry), pct = a => fmt(100 * a / selA, 1) + ' %';
    const byBase = b => { const L = S.layers.find(x => x.base === b); return L && S.stats[L.id]; };
    const k = [[fmt(selA / 1e6, 2) + ' km²', 'Gebietsfläche (' + fmt(selA / 1e4, 1) + ' ha)']];
    const ewL = S.layers.find(x => x.base === 'bevoelk'); if (ewL && S.selection) { const e = UA.ewSum(ewL.raw, S.selection.geometry);
      k.push([fmt(e.ew), 'Einwohner im Gebiet']); if (e.ha) k.push([fmt(e.ew / e.ha, 0), 'Einwohner je ha (Ø der erfassten Fläche)']); }
    const hwL = S.layers.find(x => x.base === 'hochwasser');
    if (hwL) for (const z of hwL.hw) { const fs = hwL.features.filter(f => f.properties._sz === z); if (!fs.length) continue;
      const a = UA.layerStats({ statMode: 'clip', classes: [{ key: 'x' }], features: fs.map(f => ({ geometry: f.geometry, properties: { _cls: 'x' } })) }, S.selection, intersect).total.area;
      k.push([fmt(Math.min(100, 100 * a / selA), 1) + ' %', 'des Gebiets überflutet bei ' + UA.HW_SZ[z].short]); }
    const dgL = S.layers.some(x => x.base === 'hoehenlinien' || x.base === 'hangneigung'), dst = dgL && UA.dgmStats(S.cache.data.dgm, S.selection.geometry);
    if (dst) { k.push([`${fmt(dst.min, 1)}–${fmt(dst.max, 1)} m`, 'Geländehöhe (m ü. NHN)']); k.push([fmt(dst.max - dst.min, 1) + ' m', 'Höhenunterschied im Gebiet']); if (dst.slope != null) k.push([fmt(dst.slope, 1) + ' %', 'mittlere Geländeneigung']); }
    const lmL = S.layers.find(x => x.base === 'laerm');
    if (lmL && lmL.features.length) for (const thr of lmL.lz === 'N' ? [50, 55, 60] : [55, 65, 70]) { const fs = lmL.features.filter(f => f.properties._lo != null && f.properties._lo >= thr); if (!fs.length) continue;
      const a = UA.layerStats({ statMode: 'clip', classes: [{ key: 'x' }], features: fs.map(f => ({ geometry: f.geometry, properties: { _cls: 'x' } })) }, S.selection, intersect).total.area;
      k.push([fmt(Math.min(100, 100 * a / selA), 1) + ' %', `des Gebiets ab ${thr} dB(A) ${lmL.lz === 'N' ? 'nachts' : 'ganztags'}`]); }
    const flS = byBase('flurst'); if (flS && flS.total.count) { k.push([fmt(flS.total.count), 'Flurstücke im Gebiet']); k.push([fmt(flS.total.area / flS.total.count) + ' m²', 'mittlere Flurstücksgröße']); }
    const bS = byBase('gebaeude'); if (bS) { k.push([fmt(bS.total.count), 'Gebäude im Gebiet']); k.push([pct(bS.total.area), 'Überbauungsgrad (≈ GRZ)']); }
    if (byBase('gruen')) k.push([pct(byBase('gruen').total.area), 'Grün- & Freiflächen']);
    if (byBase('wasser')) k.push([pct(byBase('wasser').total.area), 'Wasserflächen']);
    const sL = S.layers.find(x => x.base === 'strassen' && (UA.PRESETS[x.split] || {}).cls === 'strassen');
    if (sL && S.stats[sL.id]) { const s = S.stats[sL.id].classes, g = kk => (s[kk] ? s[kk].len : 0); k.push([fmt(['bund', 'haupt', 'haupt2', 'sammel', 'neben', 'service'].reduce((a, kk) => a + g(kk), 0) / 1000, 1) + ' km', 'Straßennetz (Kfz)']); k.push([fmt((g('fuss') + g('rad') + g('fuzo')) / 1000, 1) + ' km', 'Fuß- & Radwege']); }
    if (byBase('oepnv')) k.push([fmt(byBase('oepnv').total.count), 'ÖPNV-Haltestellen']);
    let html = `<div class="kpis">${k.map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
    const fL = S.layers.find(x => x.bands); const fq = fL ? UA.bandQuality([fL]) : '';
    let dl = ''; // Erklärungen zur Datenlage -> zugeklappt „Für Nerds“
    if (fq) dl += `<div class="note"><b>Datenlage Fahrbahnen:</b> ${esc(fq.replace(/^Fahrbahnbreiten /, ''))} Fuß-, Rad- und Wirtschaftswege sind keine Fahrbahnen und bleiben dünne Achsen.</div>`;
    const nL = S.layers.find(x => x.base === 'gebaeude' && (x.split === 'nutzung' || x.split === 'eg'));
    if (nL && nL.features.length) { const c = { tag: 0, amtl: 0, pkt: 0, fl: 0, na: 0 }; nL.features.forEach(f => { const q = f.properties._q || '';
        if (/Nutzungs-Punkte/.test(q)) c.pkt++; else if (/amtlich/.test(q)) c.amtl++; else if (/Flächennutzung|Wohngebäude ohne/.test(q)) c.fl++; else if (/OSM-Tag/.test(q)) c.tag++; else c.na++; });
      const n = nL.features.length, pc = v => fmt(100 * v / n);
      dl += `<div class="note"><b>Datenlage ${nL.split === 'eg' ? 'Erdgeschossnutzung' : 'Nutzung'}:</b> ${pc(c.tag)} % aus Angaben am Gebäude (OSM), ${c.amtl ? pc(c.amtl) + ' % aus amtlicher Gebäudefunktion (Kataster), ' : ''}${pc(c.pkt)} % abgeleitet aus Nutzungs-Punkten (Läden, Gastronomie, Praxen …), ${pc(c.fl)} % abgeleitet aus Flächennutzung/Gebäudeart, ${pc(c.na)} % unbekannt.</div>`; }
    const hL = S.layers.find(x => x.split === 'hoehe');
    if (hL) { const q = {}; hL.features.forEach(f => { q[f.properties._q] = (q[f.properties._q] || 0) + 1; }); const tot = hL.features.length || 1;
      dl += `<div class="note"><b>Datenlage Gebäudehöhen:</b> ${q[UA.Q_AMTL] ? fmt(100 * q[UA.Q_AMTL] / tot) + ' % amtlich gemessen (Geoportal Berlin, Laserscan), ' : ''}${q[UA.Q_AMTL_NI] ? fmt(100 * q[UA.Q_AMTL_NI] / tot) + ' % amtlich gemessen (LGLN Niedersachsen, LoD2), ' : ''}${fmt(100 * (q['OSM-Angabe (height)'] || 0) / tot)} % mit Höhenangabe in OSM, ${fmt(100 * (q['geschätzt: Geschosse × 3 m'] || 0) / tot)} % geschätzt aus Geschosszahl (× 3 m), ${fmt(100 * (q['keine Angabe'] || 0) / tot)} % unbekannt.</div>`; }
    const gq = UA.levelsQuality(S.layers.filter(x => x.split === 'geschosse').slice(0, 1));
    if (gq) dl += `<div class="note"><b>Datenlage Geschosse:</b> ${esc(gq.replace(/^Geschosszahlen /, ''))}</div>`;
    if (ewL) dl += ewL.raw.some(f => f.properties.quelle === UA.Q_EW_Z) ? `<div class="note"><b>Bevölkerung (Zensus 2022):</b> ${ewL.raw[0] && /1 km/.test(ewL.raw[0].properties.gitterzelle) ? '1-km' : '100-m'}-Gitter, Stichtag 15.5.2022. Zellen ohne Fläche sind unbewohnt oder aus Datenschutzgründen ohne Angabe; die Werte sind zur Geheimhaltung leicht verändert. Gezählt werden Zellen, deren Mitte im Gebiet liegt.</div>`
      : `<div class="note"><b>Bevölkerung (Berlin):</b> Einwohnerdichte 2025 je Block bzw. Blockteilfläche (Melderegister, Amt für Statistik Berlin-Brandenburg). Gezählt werden Blöcke, deren Mitte im Gebiet liegt. Der Anteil ab 65 Jahre gibt es nur für Berlin.</div>`;
    if (dgL) dl += `<div class="note"><b>Gelände (DGM1, LGLN):</b> amtliches Digitales Geländemodell aus Laserscan-Befliegung${S.cache.data.dgm && S.cache.data.dgm.years ? ' (' + S.cache.data.dgm.years.join(', ') + ')' : ''}, 1-m-Raster, Höhen in m über Normalhöhennull (NHN), Höhengenauigkeit laut LGLN ≤ 0,3 m. Es zeigt den Boden ohne Gebäude und Bäume.${S.cache.data.dgm && S.cache.data.dgm.res > 1 ? ' Wegen der Gebietsgröße wurde auf ' + S.cache.data.dgm.res + '-m-Zellen gemittelt.' : ''} Höhenlinien werden aus einem leicht geglätteten 2-m-Raster berechnet, jede 5. Linie ist dicker (Haupthöhenlinie). Die Neigung wird in 5-m-Zellen gemittelt; 6 % ist die Grenze für Rampen nach DIN 18040 (barrierefrei).</div>`;
    if (lmL) dl += `<div class="note"><b>Verkehrslärm:</b> amtliche Lärmkartierung 2022 nach EU-Umgebungslärmrichtlinie (Umweltbundesamt, Daten der Länder), berechnet 4 m über Boden. Kartiert sind Hauptverkehrsstraßen mit mehr als 3 Mio. Kfz pro Jahr und in Ballungsräumen (z. B. Berlin, Hannover, Braunschweig) weitere Straßen. Ruhigere Straßen sowie Pegel unter 55 dB(A) ganztags bzw. 50 dB(A) nachts sind nicht enthalten – „kein Eintrag“ heißt also nicht „leise“. <i>Lden</i> = Mittel über 24 h mit Zuschlägen für Abend (+5 dB) und Nacht (+10 dB). Orientierung: ab 65 dB(A) ganztags bzw. 55 dB(A) nachts gilt Lärm als gesundheitsgefährdend. Bahn- und Fluglärm sind nicht enthalten.</div>`;
    if (hwL) dl += `<div class="note"><b>Hochwasser:</b> amtliche Gefahrenkarten nach EU-Hochwasserrichtlinie, berechnet von den Ländern, gesammelt von der Bundesanstalt für Gewässerkunde. <i>häufig</i> = Hochwasser, das oft vorkommt (je nach Land etwa alle 10–20 Jahre), <i>HQ100</i> = statistisch einmal in 100 Jahren, <i>extrem</i> = sehr seltenes Ereignis bzw. Versagen von Schutzanlagen. „Geschützt“ heißt: die Fläche liegt hinter Deichen und wird nur überflutet, wenn diese versagen. An der niedersächsischen Küste ist nur das Extremereignis kartiert. Starkregen ist nicht enthalten – Flächen ohne Eintrag sind also nicht automatisch sicher. Prozente: Fläche im Gebiet, auch „geschützte“ Flächen mitgezählt.</div>`;
    if (dl) html += nerd('stats', dl);
    for (const L of S.layers.slice().reverse()) {
      const s = S.stats[L.id]; if (!s || L.statMode === 'none') continue;
      const rows = L.classes.filter(c => s.classes[c.key] && s.classes[c.key].count > 0); if (!rows.length) continue;
      const kind = rows.some(c => s.classes[c.key].area > 0) ? 'area' : rows.some(c => s.classes[c.key].len > 0) ? 'len' : 'count';
      const v = c => kind === 'area' ? s.classes[c.key].area : kind === 'len' ? s.classes[c.key].len : s.classes[c.key].count;
      const maxV = Math.max(...rows.map(v)) || 1;
      html += `<div class="st-l">${esc(L.name)}<span class="spacer"></span><span class="muted tiny">${kind === 'len' ? 'Länge' : kind === 'count' ? 'Anzahl' : 'Fläche · Anteil'}</span></div>`;
      for (const c of rows.slice(0, 25)) {
        const x = s.classes[c.key];
        const val = kind === 'len' ? fmt(x.len / 1000, 2) + ' km' : kind === 'count' ? fmt(x.count) : fmt(x.area / 1e4, 2) + ' ha';
        const sub = kind === 'area' ? pct(x.area) : fmt(x.count) + '×';
        html += `<div class="st-row"><i style="background:${c.color}"></i><span>${esc(c.label)}</span><em>${val}</em><em>${sub}</em></div><div class="bar"><div style="width:${(v(c) / maxV * 100).toFixed(1)}%;background:${c.color}"></div></div>`;
      }
      if (rows.length > 25) html += `<div class="tiny muted" style="padding:0 14px">… und ${rows.length - 25} weitere Klassen</div>`;
    }
    html += `<div class="pad tiny muted">Flächen sind auf das Gebiet zugeschnitten. Gebäude zählen, wenn ihr Mittelpunkt im Gebiet liegt. Freiraum-Flächen können sich in OSM überlagern (z. B. Spielplatz im Park).</div>`;
    box.innerHTML = html;
  }

  /* ---------- Element-Eigenschaften (inkl. Bearbeiten) ---------- */
  function renderProps() {
    const box = $('#props'); const s = selFeature();
    if (!s) { box.className = 'muted pad'; box.innerHTML = 'Klicke auf ein Gebäude, eine Fläche oder Straße in der Karte.'; return; }
    box.className = '';
    const { L, f } = s, p = f.properties, c = L.classes.find(x => x.key === p._cls) || { label: '?', color: '#999' };
    const q = p._q; const badge = !q ? '' : q === 'keine Angabe' ? `<span class="badge na">${q}</span>` : /geschätzt|abgeleitet|manuell/.test(q) ? `<span class="badge est">${q}</span>` : `<span class="badge">${q}</span>`;
    const [ty, oid] = String(p.osm_id || '').split('/');
    const tags = Object.keys(p).filter(k => k[0] !== '_' && k !== 'osm_id').sort();
    const name = p.name || [p['addr:street'], p['addr:housenumber']].filter(Boolean).join(' ') || c.label;
    box.innerHTML = `<div class="ph"><b>${esc(name)}</b><div class="muted tiny">${esc(L.name)}${UA.isPoly(f.geometry) ? ' · ' + fmt(UA.polyArea(f.geometry)) + ' m² Grundfläche' : ''}</div>
      <div class="tag"><span class="sw" style="background:${c.color}"></span>${esc(c.label)} ${badge}</div></div>
      ${p.hoehe_m !== undefined ? `<div class="note">Höhe: <b>${p.hoehe_m != null ? fmt(p.hoehe_m, 1) + ' m' : 'unbekannt'}</b>${p.geschosse ? ' · ' + fmt(p.geschosse) + ' Geschosse' + (/geschätzt/.test(p.geschosse_quelle || '') ? ' (geschätzt)' : '') : ''} · Herkunft: ${esc(p.hoehe_quelle)}${p.geschosse && p.geschosse_quelle ? '<br><span class="tiny">Geschosse: ' + esc(p.geschosse_quelle) + '</span>' : ''}</div>` : ''}
      ${p.hoehe_m === undefined && p.geschosse_quelle ? `<div class="note">Geschosse: <b>${fmt(p.geschosse)}</b> · Herkunft: ${esc(p.geschosse_quelle)}${p._amtl_trauf != null ? ' (Traufhöhe ' + fmt(p._amtl_trauf, 1) + ' m)' : ''}</div>` : ''}
      ${p.natural === 'tree' || p.baum_quelle ? `<div class="note"><b>Baum</b>${p.baumart || p['species:de'] || p.species ? ': ' + esc(p.baumart || p['species:de'] || p.species) : ''}
        ${p._krone_m ? ' · Krone ' + fmt(p._krone_m, 1) + ' m' : ' · Krone unbekannt'}${p.baumhoehe_m || p.height ? ' · Höhe ' + esc(p.baumhoehe_m || p.height) + ' m' : ''}${p.pflanzjahr ? ' · gepflanzt ' + esc(p.pflanzjahr) : ''}
        <br><span class="tiny">Quelle: ${esc(p.baum_quelle || 'OpenStreetMap')}</span></div>` : ''}
      ${p.gebaeudefunktion_amtlich ? `<div class="note"><b>Amtliche Gebäudefunktion:</b> ${esc(p.gebaeudefunktion_amtlich)} <span class="tiny">(Liegenschaftskataster)</span></div>` : ''}
      ${p.nutzungen_im_gebaeude ? `<div class="note"><b>Nutzungen im Gebäude</b> (OSM-Punkte): ${esc(p.nutzungen_im_gebaeude)}</div>` : ''}
      ${p.fahrbahn_breite_m !== undefined ? `<div class="note">Fahrbahnbreite: <b>${fmt(p.fahrbahn_breite_m, 1)} m</b> · Herkunft: ${esc(p.breite_quelle)}</div>` : ''}
      <div class="pad" style="padding-top:4px"><div style="display:flex;gap:6px;align-items:center">
        <span class="tiny muted" style="width:70px">Klasse</span><select id="reCls" class="inp sm" style="flex:1">${L.classes.map(x => `<option value="${esc(x.key)}" ${x.key === p._cls ? 'selected' : ''}>${esc(x.label)}</option>`).join('')}</select></div>

      <table class="ptab">${tags.map(k => `<tr><td title="${esc(k)}">${esc(UA.attrLabel(k))}</td><td>${esc(p[k] == null ? '–' : UA.valDE(p[k]))}</td></tr>`).join('')}</table>`;
    $('#reCls').onchange = ev => { const nf = Object.assign({}, f, { properties: Object.assign({}, p, { _cls: ev.target.value, _q: 'manuell geändert' }) }); L.features = L.features.slice(); L.features[p._i] = nf; refreshLayer(L); record(`${L.name}: Element → „${clsName(L, ev.target.value)}“`); };
    $('#delFeat').onclick = () => { L.raw = L.raw.filter(r => r.properties.osm_id !== p.osm_id); L.features = L.features.filter((_, i) => i !== p._i); if (L.bandGeom) L.bandGeom = L.bandGeom.filter((_, i) => i !== p._i); if (L.bandEdge) L.bandEdge = L.bandEdge.filter((_, i) => i !== p._i); L.features.forEach((x, i) => { x.properties._i = i; }); S.selectedRef = null; highlight(); refreshLayer(L);  record(`${L.name}: Element entfernt`); };
  }

  /* ---------- Bausteine (Gruppen-Tabs) ---------- */
  function itemColor(it) {
    if (it.query) return '#F2D16B';
    const B = UA.BASES[it.base]; if (!it.only) return B.color;
    const P = UA.PRESETS[it.split]; const cl = P && P.cls ? UA.CL[P.cls].find(c => c.key === it.only[0]) : null;
    return cl ? cl.color : B.color;
  }
  function renderModules() {
    const cnt = g => g.items.filter(it => S.chosen.has(it.id)).length;
    $('#gtabs').innerHTML = UA.GROUPS.map(g => `<button data-g="${g.id}" class="${g.id === S.gtab ? 'on' : ''}">${esc(g.label)}${cnt(g) ? `<span class="cnt">${cnt(g)}</span>` : ''}</button>`).join('');
    const G = UA.GROUPS.find(g => g.id === S.gtab);
    $('#modules').innerHTML = G.items.map(it => `<span class="chip ${S.chosen.has(it.id) ? 'on' : ''}" data-id="${it.id}" title="${it.hint ? esc(it.hint) : it.query ? 'Eigene OSM-Abfrage: ' + esc(it.query.map(q => q[0] + '=' + q[1]).join(' oder ')) : it.only ? 'Teilmenge aus „' + esc(UA.BASES[it.base].label) + '“' : 'Alle ' + esc(UA.BASES[it.base].label)}"><i style="background:${itemColor(it)}"></i>${esc(it.label)}</span>`).join('');
    $('#btnStd').hidden = S.gtab !== 'basis';
    $('#modHint').textContent = S.gtab === 'basis' ? '' : 'Jeder Baustein wird ein eigener Layer';
    const n = S.chosen.size;
    $('#btnRun').textContent = n ? `Auswahl laden (${n})` : 'Auswahl laden';
    $('#sumMods').textContent = n ? `${n} gewählt` : '';
  }
  $('#gtabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.gtab = b.dataset.g; renderModules(); });
  $('#modules').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; const id = c.dataset.id; S.chosen.has(id) ? S.chosen.delete(id) : S.chosen.add(id); renderModules(); });
  $('#btnStd').onclick = () => { UA.STANDARD.forEach(b => S.chosen.add(b)); renderModules(); };
  $('#btnNone').onclick = () => { S.chosen = new Set(); renderModules(); };
  $('#btnRun').onclick = () => {
    const order = []; UA.GROUPS.forEach(g => g.items.forEach(it => { if (S.chosen.has(it.id) && !order.includes(it.id)) order.push(it.id); }));
    load(order.map(id => UA.itemTask(id)).filter(Boolean).map(t => Object.assign(t, { mono: true }))); // Bausteine starten einfarbig (Monochrom)
  };

  /* ---------- Verlauf: jeder Arbeitsschritt wird gemerkt -> Rückgängig / Wiederholen ----------
     Nach jedem Schritt wird der Stand aller Layer festgehalten (Farben, Aufteilung, Sichtbarkeit, Reihenfolge, Elemente,
     Sonnenstand, Gebiet). Große Datenlisten werden nicht kopiert, nur ihre Reihenfolge – das bleibt schnell. */
  const H = { list: [], pos: -1, max: 60, lock: false };
  const DEEP_KEYS = new Set(['classes', 'styles', 'order', 'merges', 'sun', 'sunInfo']);
  const jclone = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const cloneLayer = L => { const o = {}; for (const k of Object.keys(L)) { const v = L[k]; o[k] = DEEP_KEYS.has(k) ? jclone(v) : Array.isArray(v) ? v.slice() : v; } return o; };
  const snapState = () => ({ layers: S.layers.map(L => ({ L, st: cloneLayer(L) })), sun: jclone(S.sun), sel: S.selection, mode: S.areaMode, cache: S.cache }); // Auswahl der Bausteine zählt nicht als Schritt
  function restoreState(sn) {
    H.lock = true;
    try {
      const keep = new Set(sn.layers.map(x => x.L)), vis = new Map(S.layers.map(L => [L, new Map(L.classes.map(c => [c.key, c.visible !== false]))])); // Untergruppen-Sichtbarkeit bleibt
      S.layers.filter(L => !keep.has(L)).forEach(L => removeLayer(L.id, true));
      sn.layers.forEach(({ L, st }) => { for (const k of Object.keys(L)) if (!(k in st)) delete L[k]; Object.assign(L, cloneLayer(st));
        const v = vis.get(L); if (v) L.classes.forEach(c => { if (v.has(c.key) && v.get(c.key) !== (c.visible !== false)) UA.setClassStyle(L, c.key, { visible: v.get(c.key) }); }); });
      S.layers = sn.layers.map(x => x.L); S.sun = jclone(sn.sun);
      if (sn.sel !== S.selection || sn.mode !== S.areaMode) { S.selection = sn.sel; S.areaMode = sn.mode; S.cache = sn.cache;
        document.querySelectorAll('#areaMode button').forEach(x => x.classList.toggle('on', x.dataset.m === S.areaMode)); drawSelection(); updateAreaInfo(); }
      S.selectedRef = null; highlight(); syncLayers();
      S.layers.filter(L => L.base === 'schatten').forEach(L => { try { shadowFull(L); redrawShadow(L); } catch (e) { console.warn(e); } });
      computeStats(); renderModules(); renderAll();
    } finally { H.lock = false; }
  }
  function record(label) { // neuen Arbeitsschritt merken
    if (H.lock) return;
    H.list.splice(H.pos + 1).forEach(x => x.el && x.el.remove()); // „wiederholbare“ Schritte verfallen
    const el = document.createElement('div'); el.className = 'hrow';
    const t = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    el.innerHTML = `<span class="hd"></span><span class="ht" title="${esc(label)}">${esc(label)}</span><span class="hz">${t}</span>`;
    const entry = { label, snap: snapState(), el }; el._h = entry; H.list.push(entry); H.pos = H.list.length - 1;
    const alive = H.list.filter(x => x.snap); if (alive.length > H.max) { alive[0].snap = null; alive[0].el.classList.add('gone'); alive[0].el.title = 'Zu alt – nicht mehr rückgängig'; }
    $('#log').prepend(el); $('#log').scrollTop = 0; renderHistUI(); // neuester Schritt oben
  }
  function renderHistUI() {
    H.list.forEach((x, i) => { x.el.classList.toggle('cur', i === H.pos); x.el.classList.toggle('undone', i > H.pos); });
    const prev = H.list[H.pos - 1], next = H.list[H.pos + 1];
    $('#btnUndo').disabled = !(prev && prev.snap); $('#btnRedo').disabled = !next;
    $('#btnUndo').title = prev && prev.snap ? `Rückgängig: ${H.list[H.pos].label} (Strg+Z)` : 'Nichts rückgängig zu machen';
    $('#btnRedo').title = next ? `Wiederholen: ${next.label} (Strg+Y)` : 'Nichts zu wiederholen';
  }
  function goStep(i) {
    if (S.busy) { hint('Bitte warten, bis das Laden fertig ist', 1500); return; }
    const e = H.list[i]; if (!e || !e.snap || i === H.pos) return;
    const txt = i < H.pos ? 'Rückgängig: ' + H.list[H.pos].label : 'Wiederholt: ' + e.label;
    restoreState(e.snap); H.pos = i; renderHistUI(); hint((txt.startsWith('Rück') ? '↶ ' : '↷ ') + txt, 1000);
  }
  const undoStep = () => goStep(H.pos - 1), redoStep = () => goStep(H.pos + 1);
  $('#btnUndo').onclick = undoStep; $('#btnRedo').onclick = redoStep;
  $('#log').addEventListener('click', e => { const r = e.target.closest('.hrow'); if (r && r._h) goStep(H.list.indexOf(r._h)); });
  document.addEventListener('keydown', e => { // Strg+Z / Strg+Y / Strg+Umschalt+Z
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return; const k = e.key.toLowerCase(); if (k !== 'z' && k !== 'y') return;
    const t = e.target; if (t.tagName === 'TEXTAREA' || t.isContentEditable || (t.tagName === 'INPUT' && !/^(range|checkbox|radio|color|button)$/.test(t.type))) return; // in Textfeldern: normales Rückgängig
    e.preventDefault(); if (k === 'y' || e.shiftKey) redoStep(); else undoStep();
  }, true);
  const recordLater = (label, ms) => setTimeout(() => record(typeof label === 'function' ? label() : label), ms || 600); // nach Neuberechnung (Sonne/Schatten)
  // Layer-Panel: Klicks
  const clsName = (L, k) => { const c = L && L.classes.find(x => x.key === k); return c ? c.label : k; };
  const ACT_LABEL = {
    vis: L => `${L.name} ${L.visible ? 'eingeblendet' : 'ausgeblendet'}`, hliv: L => `${L.name}: Abstand ${String(L.iv).replace('.', ',')} m`,
    lz: L => `${L.name}: ${UA.LZ[L.lz].short}`, hwsz: L => `${L.name}: Szenario ${L.hw.map(z => UA.HW_SZ[z].short).join(' + ')}`,
    dup: L => `${L.name} dupliziert`, radius: () => 'Einzugsradien ÖPNV erzeugt'
  };
  const SUN_ACT = { sunday: 'Sonne: Tag geändert', sundel: 'Sonne: Uhrzeit entfernt', sunadd: 'Sonne: Uhrzeit hinzugefügt', liveoff: 'Sonne: Live-Schatten aus' };
  $('#layerList').addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act, row = el.closest('.layer'), L = row && S.layers.find(x => x.id === row.dataset.id);
    const k = el.closest('.cls') && el.closest('.cls').dataset.k;
    if (SUN_ACT[a]) recordLater(SUN_ACT[a]); else if (ACT_LABEL[a] && L) record(ACT_LABEL[a](L, k));
  });
  // Layer-Panel: Regler/Farbe fertig, Auswahllisten, Namen
  $('#layerList').addEventListener('change', e => {
    const el = e.target, a = el.dataset.act, row = el.closest('.layer'), L = row && S.layers.find(x => x.id === row.dataset.id); if (!L) return; const k = el.closest('.cls') && el.closest('.cls').dataset.k;
    if (a === 'op') record(`${L.name}: Deckkraft ${Math.round(L.opacity * 100)} %`);
    else if (a === 'col') record(`${L.name}: Farbe „${clsName(L, k)}“`);
    else if (a === 'lbl') record(`${L.name}: Name „${clsName(L, k)}“`);
    else if (a === 'split') record(`${L.name}: aufgeteilt ${L.split.startsWith('attr:') ? '' : 'nach '}${splitLabel(L)}`);
    else if (a === 'ext') record(`${L.name}: 3D ${L.extrude ? 'an' : 'aus'}`);
    else if (a === 'sunscale') recordLater(() => `${L.name}: Größe ${Math.round((L.sunScale || 1) * 100)} %`, 200);
    else if (a === 'sunlive') recordLater(() => `Sonne: Live ${S.sun && S.sun.live != null ? UA.timeLabel(S.sun.live) : 'aus'}`, 900);
    else if (a === 'sundate') recordLater('Sonne: Datum geändert');
  });
  $('#layerList').addEventListener('drop', () => setTimeout(() => record('Reihenfolge geändert'), 0));
  /* Bereiche ein-/ausklappen (wird gemerkt) */
  function applyFold() { [['area', '#secArea'], ['mods', '#secMods']].forEach(([k, sel]) => $(sel).classList.toggle('closed', !!S.folded[k])); }
  document.querySelectorAll('.sec-h.toggle').forEach(h => h.addEventListener('click', e => {
    if (e.target.closest('button')) return; const k = h.dataset.sec; S.folded[k] = !S.folded[k]; store.set('ua_folded', S.folded); applyFold();
  }));

  /* ---------- Detail-Abfrage (QuickOSM) ---------- */

  /* ---------- Verlauf (Meldungen) ---------- */
  function log({ title, body = '', status = 'ok', user = false }) {
    const el = document.createElement('div'); el.className = 'msg' + (user ? ' user' : '');
    const set = (st, t, b) => { el.innerHTML = user ? esc(body) : `<div class="mh"><span class="st ${st}"></span>${t}</div><div>${b}</div>`; };
    set(status, title, body); $('#log').prepend(el); $('#log').scrollTop = 0; // Neues steht oben
    return { el, set };
  }

  /* ---------- Export ---------- */
  function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  const base = () => UA.safeName($('#projName').value || 'Projekt');
  const today = () => new Date().toLocaleDateString('de-DE');
  async function exportLayers(fmtName, layers, o) {
    o = Object.assign({ title: 'Analyseplan', scale: 10000, clip: true, legend: true, realCoords: false }, o || {});
    if (!S.selection) { alert('Bitte zuerst ein Gebiet wählen und Daten laden.'); return; }
    layers = UA.visLayers(layers);
    if (!layers.length && fmtName !== 'png') { alert('Keine sichtbaren Elemente zum Exportieren.'); return; }
    const fname = `${base()}_${UA.safeName(o.title)}`;
    try {
      if (fmtName === 'svg' || fmtName === 'pdf') {
        const r = UA.buildSVG(layers, S.selection, { scale: o.scale, clip: o.clip, legend: o.legend, title: o.title, subtitle: S.selection.properties.name + ' · ' + $('#projName').value, date: today() });
        if (fmtName === 'svg') { download(fname + '.svg', new Blob([r.svg], { type: 'image/svg+xml' })); return; }
        const w = window.open('', '_blank'); if (!w) { alert('Bitte Pop-ups für diese Datei erlauben, damit der Druckdialog öffnen kann.'); return; }
        w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(fname)}</title><style>@page{size:${r.widthMM.toFixed(1)}mm ${r.heightMM.toFixed(1)}mm;margin:0}html,body{margin:0}svg{display:block;width:${r.widthMM.toFixed(1)}mm;height:${r.heightMM.toFixed(1)}mm}</style></head><body>${r.svg.replace(/^<\?xml[^>]*>/, '')}<script>setTimeout(function(){print()},500)<\/script></body></html>`);
        w.document.close(); return;
      }
      if (fmtName === 'dxf') { download(fname + '.dxf', new Blob([UA.buildDXF(layers, S.selection, { realCoords: o.realCoords }).dxf], { type: 'application/dxf' })); return; }
      if (fmtName === 'geojson') {
        const sel = { type: 'FeatureCollection', name: 'Untersuchungsgebiet', features: [S.selection] };
        if (window.JSZip) {
          const z = new JSZip();
          layers.forEach(L => z.file(UA.safeName(L.name) + '.geojson', JSON.stringify(UA.exportGeoJSON(L))));
          z.file('Untersuchungsgebiet.geojson', JSON.stringify(sel));
          z.file('LIESMICH.txt', `URBAN ANALYST Export – ${today()}\r\nKoordinaten: WGS84 (EPSG:4326). In QGIS: Dateien per Drag & Drop öffnen.\r\nAttribut "klasse_name" = Klasse, "farbe" = Farbe aus der App, "datenherkunft" = OSM-Angabe / geschätzt / unbekannt.\r\nDaten: (c) OpenStreetMap-Mitwirkende, ODbL.\r\n`);
          download(fname + '_GeoJSON.zip', await z.generateAsync({ type: 'blob' }));
        } else layers.forEach(L => download(`${base()}_${UA.safeName(L.name)}.geojson`, new Blob([JSON.stringify(UA.exportGeoJSON(L))], { type: 'application/geo+json' })));
        return;
      }
      if (fmtName === 'png') map.getCanvas().toBlob(b => download(fname + '.png', b), 'image/png');
    } catch (e) { console.error(e); alert('Export fehlgeschlagen: ' + e.message); }
  }
  const dlg = $('#dlg');
  $('#btnExport').onclick = () => {
    if (!S.layers.length) { log({ title: 'Export', status: 'warn', body: 'Lade zuerst Daten in einem Gebiet.' }); return; }
    const n = UA.visLayers(S.layers.filter(L => L.visible)).reduce((a, L) => a + L.features.length, 0);
    $('#exInfo').innerHTML = `${S.layers.filter(L => L.visible).length} sichtbare Layer · ${fmt(n)} sichtbare Elemente. Ausgeblendete Klassen werden nicht exportiert.${n > 60000 ? ' Große Datei: Illustrator braucht beim Öffnen evtl. etwas Zeit.' : ''}`;
    dlg.hidden = false;
  };
  dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.hidden = true; });
  $('#btnDoExport').onclick = () => {
    const f = document.querySelector('input[name=fmt]:checked').value;
    const layers = $('#exVisible').checked ? S.layers.filter(L => L.visible) : S.layers.slice();
    exportLayers(f, layers, { title: $('#exTitle').value || 'Analyseplan', scale: +$('#exScale').value, clip: $('#exClip').checked, legend: $('#exLegend').checked, realCoords: $('#exReal').checked });
    dlg.hidden = true;
  };

  /* ---------- Projekt speichern / öffnen ---------- */
  $('#btnSaveProj').onclick = () => {
    const layers = S.layers.map(L => Object.assign({}, L, { features: undefined, bandGeom: undefined, bandEdge: undefined }));
    const proj = { app: 'URBAN ANALYST', version: 2, name: $('#projName').value, selection: S.selection, chosen: [...S.chosen], views: S.views, view: { center: map.getCenter().toArray(), zoom: map.getZoom() }, layers };
    download(base() + '.urbananalyst.json', new Blob([JSON.stringify(proj)], { type: 'application/json' }));
  };
  $('#btnOpenProj').onclick = () => $('#fileProj').click();
  $('#fileProj').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const p = JSON.parse(await file.text()); if (p.app !== 'URBAN ANALYST' || p.version !== 2) throw new Error('Keine passende URBAN-ANALYST-Projektdatei');
      S.layers.slice().forEach(L => removeLayer(L.id, true));
      $('#projName').value = p.name || 'Projekt'; S.selection = p.selection; S.chosen = new Set(p.chosen || []); S.cache = { key: null, data: {} };
      if (p.views) { S.views = p.views; store.set('ua_views', S.views); renderViews(); }
      S.layers = (p.layers || []).map(L => UA.applySplit(L, L.split, {}));
      drawSelection(); syncLayers(); computeStats(); updateAreaInfo(); renderModules(); renderAll(); fitSel();
      log({ title: 'Projekt geöffnet', status: 'ok', body: `${esc(file.name)} · ${S.layers.length} Layer` }); record('Projekt geöffnet: ' + file.name);
    } catch (err) { log({ title: 'Öffnen fehlgeschlagen', status: 'err', body: esc(err.message) }); }
    e.target.value = '';
  };

  /* ---------- Darstellung ---------- */
  $('#btnTheme').onclick = () => {
    S.theme = S.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = S.theme;
    if (S.basemap === 'dark' || S.basemap === 'light') setBasemap(S.theme); else setBasemap(S.basemap);
  };
  $('#basemap').onchange = e => setBasemap(e.target.value);

  /* ---------- Start ---------- */
  $('#basemap').value = S.basemap;
  applyFold(); renderModules(); renderViews(); updateAreaInfo(); renderAll();
  setTimeout(() => record('Start'), 0); // erster Stand (nach der Willkommens-Meldung)
  log({ title: 'Willkommen', status: 'ok', body: 'So geht’s:<ul><li><b>Gebiet</b>: Ort suchen und „Als Gebiet“ wählen, unten ein Rechteck zeichnen oder auf „Aktuelle Kartenansicht“ stellen.</li><li><b>Bausteine</b> anklicken (Gebäude, Straßen …) und „Auswahl laden“.</li><li><b>Verlauf</b>: Hier steht jeder Arbeitsschritt. Mit <b>↶ / ↷</b> oben (oder <b>Strg+Z</b> / <b>Strg+Y</b>) machst du Schritte rückgängig oder wiederholst sie; ein Klick auf einen Schritt springt dorthin.</li><li>Rechts bei jedem Layer unter ▾ <b>„Aufteilen nach“</b> wählen, wie in QGIS. Layer und Untergruppen mit <b>⋮⋮</b> verschieben, mit dem Papierkorb löschen.</li><li><b>Laden abbrechen</b>: Knopf oben in der Ladeanzeige.</li></ul>' });
  window.UA_STATE = S; // zum Nachsehen in der Konsole (F12)
})();

</script>
</body>
</html>
